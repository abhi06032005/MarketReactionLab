[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketreactionlab"
version = "0.1.0"
description = "Production-quality financial ML data engineering pipeline for next-session market-adjusted stock reaction prediction"
authors = [{ name = "Senior ML Data Engineer", email = "research@marketreactionlab.internal" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "exchange_calendars>=4.5.0",
    "huggingface_hub>=0.20.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pytest>=7.4.0",
    "matplotlib>=3.7.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
