# MarketReactionLab Data Pipeline Configuration
project_name: "MarketReactionLab"
version: "1.0.0"

paths:
  symbols_config: "configs/symbols.yaml"
  raw_news_dir: "data/raw/news"
  raw_prices_dir: "data/raw/prices"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  reports_dir: "reports"

source:
  repo_id: "Zihan1004/FNSPID"
  news_file: "Stock_news/All_external.csv"
  prices_file: "Stock_price/full_history.zip"
  max_news_bytes: 35000000 # 35 MB scan for prototype phase
  license: "CC BY-NC-4.0"
  provenance_url: "https://huggingface.co/datasets/Zihan1004/FNSPID"

market:
  benchmark: "SPY"
  timezone: "America/New_York"
  exchange: "XNYS"

splits:
  chronological:
    train_start: "2012-01-01"
    train_end: "2017-12-31"
    val_start: "2018-01-01"
    val_end: "2018-12-31"
    test_start: "2019-01-01"
    test_end: "2020-06-10"
  purge_embargo_sessions: 2

labels:
  threshold: 0.005 # 0.5% market-adjusted return threshold for UP / NEUTRAL / DOWN
  class_names: ["DOWN", "NEUTRAL", "UP"]
  class_mapping:
    DOWN: 0
    NEUTRAL: 1
    UP: 2

news_processing:
  max_articles_per_cutoff: 5
  min_headline_chars: 8
  filter_movement_headlines: false # Flag instead of dropping to preserve metadata

features:
  return_lags: [1, 3, 5, 10, 20]
  rolling_vol_window: 20
  rolling_volume_window: 20
  rsi_window: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
